name: Validate Tikizia Games website

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-site.mjs
      - run: node --test scripts/test-site.mjs
      - name: Generated pages are committed and current
        run: git diff --exit-code -- public
