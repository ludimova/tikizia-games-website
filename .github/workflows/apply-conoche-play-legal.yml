name: Apply Conoche Play legal hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/harden_conoche_play_legal.py
      - .github/workflows/apply-conoche-play-legal.yml

permissions:
  contents: write

jobs:
  legal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/harden_conoche_play_legal.py
      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Date of birth and age-status declaration" public/privacy/index.html
          grep -q "Push-notification registration tokens" public/privacy/index.html
          grep -q "Safety and moderation information" public/privacy/index.html
          grep -q "/community-guidelines/" public/terms/index.html
          grep -q "specific user-generated content" public/community-guidelines/index.html
      - name: Commit legal hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/privacy/index.html public/terms/index.html public/community-guidelines/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden Conoche legal and community pages"
          git push origin HEAD:main
