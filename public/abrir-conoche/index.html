<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Abrir Conoche?</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff8ec;
      color: #14345f;
      font: 1.05rem/1.55 "Trebuchet MS", "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 540px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid #ddcbb6;
      border-radius: 24px;
      background: #fffcf5;
    }
    h1 { margin: 0 0 14px; font: bold clamp(2.2rem, 8vw, 3.5rem)/1.1 Georgia, serif; }
    p { margin: 0 0 18px; }
    a { color: #b52433; font-weight: 700; }
    a:focus-visible { outline: 3px solid #d62e3a; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Volvé a Conoche?</h1>
    <p id="instruction">Si la app no se abrió, buscá Conoche? en tu celular y entrá con tu correo y la nueva contraseña.</p>
    <p id="update">Si todavía no abre desde el enlace, actualizá la app. No tenés que volver a cambiar la contraseña.</p>
    <a id="store" href="https://play.google.com/store/apps/details?id=com.tikiziagames.conoche">Ver Conoche? en Google Play</a>
  </main>
  <script>
    if (!navigator.language.toLowerCase().startsWith('es')) {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'Return to Conoche?';
      document.getElementById('instruction').textContent = 'If the app did not open, find Conoche? on your phone and sign in with your email and new password.';
      document.getElementById('update').textContent = 'If the link still does not open the app, update it. You do not need to reset your password again.';
      document.getElementById('store').textContent = 'View Conoche? on Google Play';
    }
  </script>
</body>
</html>
